spring:
  application:
    name: aprendaacodar
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:aprendaacodar-local-dev-secret-change-me-32bytes}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  storage:
    supabase-url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    public-bucket: ${SUPABASE_PUBLIC_BUCKET:aprenda-acodar-public}
    private-bucket: ${SUPABASE_PRIVATE_BUCKET:aprenda-acodar-private}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
